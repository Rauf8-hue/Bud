name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VERSION_OUTPUT=$(java -version 2>&1)
          JAVA_MAJOR=$(echo "$JAVA_VERSION_OUTPUT" | sed -nE 's/.*version "([0-9]+).*/\1/p' | head -n 1)

          if [ -z "$JAVA_MAJOR" ]; then
            echo "ERROR: Failed to detect active Java major version."
            exit 1
          fi

          echo "Detected active Java major version: $JAVA_MAJOR"

          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "ERROR: Active Java major version ($JAVA_MAJOR) is lower than 17."
            exit 1
          fi

          echo "Java environment verified successfully: Java $JAVA_MAJOR >= 17."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "Debug keystore already exists at ./debug.keystore."
          else
            echo "Generating temporary debug keystore..."
            "${JAVA_HOME}/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "ERROR: Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified at ./debug.keystore."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: Expected debug APK not found at $TARGET_APK"
            echo "Searching inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk not found."
            fi
            exit 1
          fi

          if [ ! -f "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK is not a regular file."
            exit 1
          fi

          if [ ! -s "$TARGET_APK" ]; then
            echo "ERROR: $TARGET_APK is empty."
            exit 1
          fi

          case "$TARGET_APK" in
            *.apk) ;;
            *)
              echo "ERROR: $TARGET_APK does not have .apk extension."
              exit 1
              ;;
          esac

          if [ "$TARGET_APK" != "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "ERROR: Selected APK is not exactly app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi

          echo "Target APK verified successfully: $TARGET_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_release_asset
        run: |
          TMP_DIR="${RUNNER_TEMP}/apk-release-asset"
          mkdir -p "$TMP_DIR"

          REPO_NAME=$(basename "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          RUN_NUM="${{ github.run_number }}"
          ASSET_NAME="${REPO_NAME}-debug-build-${RUN_NUM}.apk"
          ASSET_PATH="${TMP_DIR}/${ASSET_NAME}"

          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Failed to prepare APK release asset at $ASSET_PATH"
            exit 1
          fi

          echo "Prepared APK release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          if ! command -v gh &> /dev/null; then
            echo "ERROR: GitHub CLI (gh) is not available."
            exit 1
          fi

          ASSET_PATH="${{ steps.prepare_release_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"

          if [ ! -f "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset does not exist at '$ASSET_PATH'."
            exit 1
          fi

          if [ ! -s "$ASSET_PATH" ]; then
            echo "ERROR: Prepared release asset at '$ASSET_PATH' is empty."
            exit 1
          fi

          case "$ASSET_PATH" in
            *.apk) ;;
            *)
              echo "ERROR: Prepared release asset is not an .apk file."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat <<EOF > "$NOTES_FILE"
          ### Automated Debug APK Build

          - **Build Type**: Automatically generated debug APK
          - **Built by**: GitHub Actions
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Source Commit**: ${{ github.sha }}

          > **Notice:**
          > - This is an automatically generated debug APK.
          > - The APK is intended for testing.
          > - The APK is not a Play Store production release.
          > - The APK is signed only with a temporary debug keystore.
          EOF

          echo "Creating GitHub Release with tag: $RELEASE_TAG, title: $RELEASE_TITLE..."
          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "${{ github.sha }}" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_OUTCOME="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          ASSET_NAME="${{ steps.prepare_release_asset.outputs.asset_name }}"

          if [ "$RELEASE_OUTCOME" = "success" ]; then
            echo "Confirming release with gh release view..."
            gh release view "$RELEASE_TAG"
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url -q .url)

            echo "=== Release Publication Succeeded ==="
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## 📱 Debug APK Build & Release Summary

            - **Build Status**: ✅ Succeeded
            - **Release Tag**: \`$RELEASE_TAG\`
            - **Release Title**: $RELEASE_TITLE
            - **Release URL**: [$RELEASE_URL]($RELEASE_URL)
            - **Direct APK Download**: You can download **\`$ASSET_NAME\`** directly from the **Assets** section of the [GitHub Release]($RELEASE_URL) on your phone or PC.
            - **Actions Artifact Backup**: The standard GitHub Actions artifact **\`app-debug-apk\`** is also uploaded and available under this workflow run.
            EOF
          else
            echo "::warning::GitHub Release publishing failed or was skipped, but the debug APK build succeeded."
            echo "The Actions artifact named app-debug-apk remains available."

            cat <<EOF >> "$GITHUB_STEP_SUMMARY"
            ## 📱 Debug APK Build Summary

            - **Build Status**: ✅ Succeeded
            - **GitHub Release Status**: ⚠️ Failed or skipped (check release step logs and repository write permissions for GITHUB_TOKEN)
            - **Actions Artifact**: The debug APK is preserved as the Actions artifact named **\`app-debug-apk\`**. You can download it directly from the Summary tab of this workflow run.
            EOF
          fi
